# .github/workflows/build.yml
# ─────────────────────────────────────────────────────────────────────────────
# AFI Build Pipeline
#
# Triggers automatically whenever a content file changes in afi-build/content/
# or when triggered manually via the GitHub Actions UI.
#
# What it does:
#   1. Checks out the repo
#   2. Sets up Python and installs dependencies
#   3. Runs build.py --all --output-dir .. (writes HTML to repo root)
#   4. Commits and pushes any changed HTML files back to main
#
# GitHub Pages must be configured to serve from the root of the main branch.
# ─────────────────────────────────────────────────────────────────────────────

name: Build AFI Publication

on:
  push:
    branches:
      - main
    paths:
      - 'afi-build/content/**.md'      # any content file change triggers build
      - 'afi-build/templates/**.j2'    # template changes also trigger rebuild
      - 'afi-build/afi_parser.py'      # parser changes trigger rebuild
  workflow_dispatch:                   # allow manual trigger from Actions UI

permissions:
  contents: write                      # needed to push generated HTML back

jobs:
  build:
    name: Build HTML from Markdown
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0               # full history so git push works cleanly

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'afi-build/requirements.txt'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r afi-build/requirements.txt

      # ── 4. Build all pages ────────────────────────────────────────────────────
      - name: Build HTML
        run: |
          cd afi-build
          python3 build.py --all --output-dir ..
          echo "Generated files:"
          ls -lh ../*.html

      # ── 5. Commit and push generated HTML ────────────────────────────────────
      - name: Commit generated HTML
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.html
          # Only commit if there are actual changes (prevents empty commits)
          git diff --staged --quiet \
            && echo "No changes to commit — HTML is already up to date." \
            || git commit -m "build: regenerate HTML from content [skip ci]"

      - name: Push changes
        run: git push origin main
